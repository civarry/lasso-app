# Build Lasso and run its tests on every push to main and every pull request, the way BUILDING.md
# describes: XcodeGen, the Metal toolchain, ad-hoc signing (the repo default; no certificate here), and
# -skipMacroValidation for the MLX package's Swift macros. Free for a public repo.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["stats/**", "**.md", "screenshots/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          sw_vers

      # lasso-pkg is built from the app's own package engine; the catalog's CI builds it the same way.
      - name: Build lasso-pkg and check every starter
        run: |
          set -euo pipefail
          Tools/lasso-pkg/build.sh "$PWD/.build/lasso-pkg"
          pkg="$PWD/.build/lasso-pkg"
          cd "$RUNNER_TEMP"
          for kind in search send prompt shortcut script; do "$pkg" new "$kind" "my-$kind"; done
          "$pkg" validate my-* --catalog
          "$pkg" run my-script count --text "one two three" | grep -q "3"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .dd/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      # A cache restored from an older project.yml keeps that resolution (versions, enabled traits),
      # which can contradict the current one; keep the downloads, resolve again.
      - name: Forget the cached package resolution
        run: rm -f .dd/SourcePackages/workspace-state.json .dd/SourcePackages/Package.resolved

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          Tools/pin-packages.sh

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -scheme Lasso -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath .dd -skipMacroValidation -disableAutomaticPackageResolution test 2>&1 | tee xcodebuild.log | grep -E "^(✔|✘|◇ Test run|\*\*)|error:" || true
          grep -q "TEST SUCCEEDED" xcodebuild.log

      - name: Upload the log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
